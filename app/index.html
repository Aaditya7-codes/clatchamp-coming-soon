<style>
#clat-prototype .cs-streak{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid #a58ac64d;border-radius:999px;background:#221a32;color:#e9ddff;font-size:11px;white-space:nowrap}
#clat-prototype .cs-streak svg{width:15px;height:15px;color:#d9b5ff}
#clat-prototype .cs-streak strong{font-size:14px}
#clat-prototype .dash-hero>.cs-meta{align-items:center;flex-wrap:nowrap;gap:8px}
#clat-prototype .dash-hero>.cs-meta>.cs-kicker{font-size:10px;letter-spacing:1.2px}
#clat-prototype .cs-option.cs-answer-correct[aria-pressed=true]{border-color:#78d8c1;background:#203b38;color:#e4fff7;opacity:1}
#clat-prototype .cs-option:disabled{cursor:default}
#clat-prototype .cs-answer-reward{display:flex;align-items:center;gap:9px;min-height:48px;margin:12px 0 16px;padding:12px 14px;border-radius:14px;background:var(--cs-soft);color:var(--cs-muted);font-size:14px;line-height:1.45}
#clat-prototype .cs-answer-reward.is-correct{background:#203b38;color:#b8f1df}
#clat-prototype .cs-reward-spark{margin-left:auto;display:flex;color:#a5e8d2}
#clat-prototype .cs-reward-pulse{animation:cs-correct-glow 700ms ease-out both}
#clat-prototype .cs-reward-enter{animation:cs-reward-arrive 350ms ease-out both}
@keyframes cs-correct-glow{0%{box-shadow:0 0 0 0 #78d8c170}45%{box-shadow:0 0 0 6px #78d8c125}100%{box-shadow:0 0 0 10px #78d8c100}}
@keyframes cs-reward-arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#clat-prototype .cs-reward-pulse,#clat-prototype .cs-reward-enter{animation:none}}

<style>
#clat-prototype{--cs-accent:#6241db;--cs-bg:#191625;--cs-panel:#252034;--cs-ink:#f5f1ff;--cs-muted:#b9b1cc;--cs-soft:#35294d;--cs-border:#443a54;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--cs-ink);max-width:420px;margin:0 auto;font-size:15px;line-height:1.5}
#clat-prototype *{box-sizing:border-box}#clat-prototype .cs-phone{background:var(--cs-bg);border:1px solid var(--cs-border);border-radius:28px;overflow:hidden}#clat-prototype .cs-top{padding:22px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}#clat-prototype .cs-brand{font-size:14px;letter-spacing:1.6px;font-weight:500;display:flex;align-items:center;gap:8px}#clat-prototype .cs-brand i{color:var(--cs-accent)}#clat-prototype .cs-kicker{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cs-muted)}#clat-prototype .cs-main{padding:12px 26px 26px;min-height:540px;display:flex;flex-direction:column}#clat-prototype h1{font-size:34px;line-height:1.12;letter-spacing:-1.3px;font-weight:500;margin:16px 0}#clat-prototype h2{font-size:27px;line-height:1.2;letter-spacing:-.7px;font-weight:500;margin:20px 0 10px}#clat-prototype p{margin:0 0 22px;color:var(--cs-muted);font-size:14px}#clat-prototype button{font:inherit;cursor:pointer}#clat-prototype .cs-primary{border:0;border-radius:16px;background:var(--cs-accent);color:#fff;min-height:52px;padding:14px 18px;width:100%;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px}#clat-prototype button:disabled{opacity:.4;cursor:default}#clat-prototype .cs-text-button{border:0;background:transparent;color:var(--cs-muted);padding:10px 0;min-height:44px}#clat-prototype .cs-footer{margin-top:auto;padding-top:24px}#clat-prototype .cs-note{text-align:center;font-size:12px;color:var(--cs-muted);margin-top:12px}#clat-prototype .cs-art{height:205px;position:relative;margin:8px 0 10px;background:radial-gradient(ellipse,var(--cs-soft) 0%,transparent 68%)}#clat-prototype .cs-orbit{position:absolute;inset:14px 52px;border:1px dashed var(--cs-border);border-radius:50%;transform:rotate(-25deg)}#clat-prototype .cs-paper{background:var(--cs-panel);border:1px solid var(--cs-border);border-radius:18px;position:absolute;width:158px;left:calc(50% - 79px);top:38px;padding:20px;transform:rotate(-9deg);box-shadow:0 16px 34px #35187912}#clat-prototype .cs-line{height:7px;border-radius:3px;background:var(--cs-border);margin:10px 0}#clat-prototype .cs-line.active{background:var(--cs-accent);width:82%}#clat-prototype .cs-token{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--cs-accent);color:#fff;width:54px;height:54px;border-radius:18px;right:32px;top:19px;transform:rotate(12deg)}#clat-prototype .cs-stamp{position:absolute;bottom:16px;left:26px;padding:10px 14px;border-radius:12px;background:var(--cs-panel);border:1px solid var(--cs-border);font-size:12px;display:flex;align-items:center;gap:8px}#clat-prototype .cs-stamp i{color:var(--cs-accent)}#clat-prototype .cs-highlight{color:#b9a5ff}#clat-prototype .cs-progress{display:flex;gap:6px;margin-bottom:16px}#clat-prototype .cs-progress span{height:4px;flex:1;background:var(--cs-border);border-radius:8px}#clat-prototype .cs-progress .done{background:var(--cs-accent)}#clat-prototype .cs-options{display:grid;gap:10px;margin:6px 0 18px}#clat-prototype .cs-option{background:var(--cs-panel);border:1px solid var(--cs-border);color:var(--cs-ink);border-radius:16px;padding:15px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:60px}#clat-prototype .cs-option[aria-pressed=true]{border-color:var(--cs-accent);background:var(--cs-soft)}#clat-prototype .cs-option small{display:block;font-size:12px;color:var(--cs-muted);margin-top:2px}#clat-prototype .cs-option .cs-radio{margin-left:auto;width:18px;height:18px;border:1px solid var(--cs-border);border-radius:50%;flex-shrink:0}#clat-prototype .cs-option[aria-pressed=true] .cs-radio{border:5px solid var(--cs-accent);background:var(--cs-panel)}#clat-prototype .cs-label{font-size:12px;color:var(--cs-muted);margin-bottom:10px}#clat-prototype .cs-minutes{display:flex;gap:8px}#clat-prototype .cs-minutes button{flex:1;border-radius:12px;min-height:46px;border:1px solid var(--cs-border);background:var(--cs-panel);color:var(--cs-ink)}#clat-prototype .cs-minutes button[aria-pressed=true]{background:var(--cs-soft);border-color:var(--cs-accent);color:var(--cs-ink)}#clat-prototype .cs-reading{padding:20px;background:var(--cs-panel);border:1px solid var(--cs-border);border-radius:18px;margin:8px 0 18px}#clat-prototype .cs-reading p{font-family:Georgia,serif;font-size:17px;line-height:1.75;color:var(--cs-ink);margin:14px 0 0}#clat-prototype .cs-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--cs-muted)}#clat-prototype .cs-result{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 22px}#clat-prototype .cs-stat{background:var(--cs-soft);border-radius:18px;padding:18px}#clat-prototype .cs-stat strong{display:block;font-size:28px;font-weight:500}#clat-prototype .cs-stat span{font-size:12px;color:var(--cs-muted)}#clat-prototype .cs-feedback{padding:16px;background:var(--cs-soft);border-radius:16px;font-size:14px;margin-top:14px}#clat-prototype .cs-path{display:grid;gap:0;margin-top:16px}#clat-prototype .cs-lesson{display:flex;gap:14px;padding:14px 0;align-items:center}#clat-prototype .cs-node{width:42px;height:42px;flex-shrink:0;display:flex;justify-content:center;align-items:center;border-radius:14px;background:var(--cs-soft);color:var(--cs-accent)}#clat-prototype .cs-lesson small{display:block;color:var(--cs-muted);font-size:12px}#clat-prototype details{font-size:13px;color:var(--cs-muted);margin-top:12px}#clat-prototype details p{margin-top:10px;font-size:14px}#clat-prototype [hidden]{display:none!important}@media(max-width:360px){#clat-prototype .cs-main{padding:10px 20px 22px}#clat-prototype .cs-top{padding:18px 20px 14px}#clat-prototype h1{font-size:30px}}
