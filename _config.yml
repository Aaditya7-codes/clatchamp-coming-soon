title: CLAT Champ
description: >-
  Plain answers about the CLAT exam — what each section tests, how to prepare,
  and how admission actually works. From the team building the CLAT Champ app.
url: "https://www.clatchamp.com"
baseurl: ""
lang: en-IN

permalink: /blog/:slug/
timezone: Asia/Kolkata

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post

exclude:
  - .qa/
  - README.md
  - .gitignore
  - "*.cjs"

sass: { style: compressed }
