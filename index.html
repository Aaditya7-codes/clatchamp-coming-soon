  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CLAT Champ",
    "url": "https://www.clatchamp.com/",
    "description": "A complete CLAT preparation app for all five sections of the paper. Coming soon to iOS and Android.",
    "inLanguage": "en-IN"
  }
  </script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="CLAT Champ home">
        <img class="brand-logo" src="/assets/brand/logo-128.png" width="34" height="34" alt="">
        <span class="nm">CLAT Champ</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" class="on" aria-current="page">Home</a>
        <a href="/blog/">Blog</a>
        <span class="chip-soon"><span class="dot" aria-hidden="true"></span>Coming soon</span>
      </nav>
    </header>

    <main>
      <section class="teaser" aria-labelledby="headline">
        <p class="t-eyebrow rise r1">Coming soon</p>
        <h1 id="headline" class="t-head rise r2">Everything you need to prepare for CLAT.</h1>
        <p class="t-lede rise r2">A complete preparation app for all five sections of the paper.</p>

        <ul class="plat rise r3" aria-label="Platforms at launch">
          <li><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>iOS</li>
          <li><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><path d="M7.7 3.9 9 6.05M16.3 3.9 15 6.05"/><path d="M4.7 10.5a7.3 7.3 0 0 1 14.6 0"/><path d="M4.7 10.5h14.6"/></g><circle cx="9.35" cy="8.5" r=".95" fill="currentColor"/><circle cx="14.65" cy="8.5" r=".95" fill="currentColor"/></svg>Android</li>
        </ul>

        <p class="countstrip rise r3">
          <span class="cs-n tnum" id="days">—</span>
          <span class="cs-l">days to CLAT&nbsp;2027</span>
          <span class="cs-sep" aria-hidden="true"></span>
          <span class="cs-d">6 December 2026</span>
        </p>

        <div class="glimpse rise r4" role="img" aria-label="A glimpse of the CLAT Champ app interface.">
          <div class="phone">
            <div class="screen">
              <span class="notch" aria-hidden="true"></span>
              <div class="s-top"><span>9:41</span><span>CLAT CHAMP</span></div>
              <div class="s-brand"><img src="/assets/brand/logo-128.png" width="18" height="18" alt="">CLAT CHAMP</div>
              <div class="s-row">
                <span class="s-date" id="appdate">Today</span>
                <span class="s-count"><span class="k">CLAT 2027</span><span class="v tnum"><span id="days2">—</span> <em>days</em></span></span>
              </div>
              <div class="s-veil" aria-hidden="true"></div>
              <div class="s-veil s-veil-2" aria-hidden="true"></div>
              <div class="s-veil s-veil-3" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>© 2026 CLAT Champ</span>
      <span>clatchamp.com</span>
    </footer>
  </div>

  <script>
    /* CLAT 2027 sits on 6 December 2026, per the Consortium of NLUs
       notification. The countdown recomputes on every load, and hides
       itself once the date has passed so it can never show a stale number. */
    (function () {
      var EXAM = new Date('2026-12-06T00:00:00+05:30');
      var days = Math.ceil((EXAM - new Date()) / 86400000);
      var strip = document.querySelector('.countstrip');

      if (days > 0 && days < 2000) {
        var a = document.getElementById('days');
        var b = document.getElementById('days2');
        if (a) a.textContent = String(days);
        if (b) b.textContent = String(days);
      } else if (strip) {
        strip.hidden = true;
      }

      var d = document.getElementById('appdate');
      if (d) {
        d.textContent = new Date().toLocaleDateString('en-IN',
          { weekday: 'long', day: 'numeric', month: 'long' });
      }
    })();
  </script>
</body>
