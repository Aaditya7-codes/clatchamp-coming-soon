---
layout: default
---
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    {% if page.standfirst %}<p class="standfirst">{{ page.standfirst }}</p>{% endif %}
    <p class="byline">
      Last updated <time datetime="{{ page.updated | date_to_xmlschema }}">{{ page.updated | date: "%-d %B %Y" }}</time>
    </p>
  </header>

  <div class="prose">{{ content }}</div>
</article>
