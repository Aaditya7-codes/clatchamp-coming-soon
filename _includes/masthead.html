<header class="masthead">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="CLAT Champ home">
    <img class="brand-logo" src="/assets/brand/logo-128.png" width="34" height="34" alt="">
    <span class="nm">CLAT Champ</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on" aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="on" aria-current="page"{% endif %}>Blog</a>
    <span class="chip-soon"><span class="dot" aria-hidden="true"></span>Coming soon</span>
  </nav>
</header>
